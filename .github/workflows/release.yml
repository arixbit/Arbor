name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    # macOS 15 public runners are Apple Silicon and match the published arm64
    # artifact name. Signed production releases use the documented maintainer
    # flow in RELEASE.md instead of storing Apple credentials in CI. Sparkle's
    # independent EdDSA key authenticates both signed and unsigned updates.
    # Validation runs in ci-test.yml on every main push; tag builds set
    # ARBOR_SKIP_TESTS=1 and only package the already-tested commit.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ARBOR_UNSIGNED: "1"
      ARBOR_ARCHS: arm64
      ARBOR_SKIP_TESTS: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Require the update signing key
        run: |
          if [[ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]]; then
            echo "Configure the SPARKLE_EDDSA_PRIVATE_KEY repository secret before releasing. See RELEASE.md." >&2
            exit 1
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arbor-engine
          shared-key: arbor-cargo
          cache-on-failure: true

      - name: Install Xcode project generator
        run: brew install xcodegen

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Build release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/release.sh "$version"
          echo "ARBOR_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish unsigned macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="build/releases/$ARBOR_RELEASE_VERSION"
          notes_file="$(mktemp "${TMPDIR:-/tmp}/arbor-release-notes.XXXXXX")"
          {
            echo "# Arbor $ARBOR_RELEASE_VERSION"
            echo
            echo "This release contains the supported unsigned arm64 macOS build."
            echo "It is not Apple-trusted; the first launch may require Gatekeeper approval."
            echo "Read the macOS Gatekeeper instructions in README.md before opening it."
            echo
            cat "$release_dir/CHANGELOG.md"
          } > "$notes_file"
          gh release create "v$ARBOR_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Arbor $ARBOR_RELEASE_VERSION (unsigned arm64)" \
            --notes-file "$notes_file" \
            "$release_dir"/Arbor-* \
            "$release_dir/appcast.xml" \
            "$release_dir/SHA256SUMS"
