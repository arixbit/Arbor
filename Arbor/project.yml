name: Arbor
options:
  bundleIdPrefix: com.arbor
  createIntermediateGroups: true
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
targets:
  Arbor:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ArborApp.swift
      - path: ContentView.swift
      - path: Design.swift
      - path: ProjectFileTreeView.swift
      - path: FileReferenceComparisonView.swift
      - path: RevisionBrowserView.swift
      - path: FileContentView.swift
      - path: LogSidebar.swift
      - path: SubmoduleChangeView.swift
      - path: RepoSidebar.swift
      - path: RebasedWorkspaceViews.swift
      - path: RebasedDialogs.swift
      - path: CommitDetailView.swift
      - path: DiffDetailView.swift
      - path: WorkspaceOperations.swift
      - path: LogGraphView.swift
      - path: PushDialogView.swift
      - path: PullDialogView.swift
      - path: HostingProvider.swift
      - path: HostingModels.swift
      - path: KeychainStore.swift
      - path: CredentialAuth.swift
      - path: GitHubClient.swift
      - path: RateLimitRetry.swift
      - path: HostingClient.swift
      - path: GitLabClient.swift
      - path: BitbucketClient.swift
      - path: GitHubOAuthFlow.swift
      - path: DiagnosticsLogger.swift
      - path: AppLanguage.swift
      - path: AppIconController.swift
      - path: BeforeCommitSettingsView.swift
      - path: ResizableWorkspacePanels.swift
      - path: UnifiedDiffView.swift
      - path: FeedbackCenter.swift
      - path: RepositoryIndexRevisionMonitor.swift
      - path: HostingViews.swift
      - path: HostingIntegration.swift
      - path: Localizable.xcstrings
      - path: Assets.xcassets
      # uniffi 生成的 Swift 绑定（引用 arbor-engine 目录，重新 generate 后自动生效）
      - path: ../arbor-engine/generated/swift/arbor_engine.swift
    settings:
      base:
        PRODUCT_NAME: Arbor
        PRODUCT_BUNDLE_IDENTIFIER: com.arbor.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # 指向 Rust release 产物目录
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/../arbor-engine/target/release
        # 让 Swift 能找到 arbor_engineFFI 模块（modulemap 所在目录）
        SWIFT_INCLUDE_PATHS:
          - $(PROJECT_DIR)/../arbor-engine/generated/swift
        # 显式指定 modulemap：clang 隐式发现只认 module.modulemap，
        # 而生成产物叫 arbor_engineFFI.modulemap，必须用 -fmodule-map-file 指明
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(PROJECT_DIR)/../arbor-engine/generated/swift/arbor_engineFFI.modulemap
        # 强制加载整个 Rust 静态库，确保 uniffi FFI 符号可见
        OTHER_LDFLAGS:
          - -force_load
          - $(PROJECT_DIR)/../arbor-engine/target/release/libarbor_engine.a
          # gix curl transport 依赖系统 libcurl
          - -lcurl
    info:
      path: Info.plist
      properties:
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
  ArborTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ArborTests
    dependencies:
      - target: Arbor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arbor.app.tests
        GENERATE_INFOPLIST_FILE: YES
        # Arbor 模块 import 了 arbor_engineFFI，测试 target 需能解析该 modulemap
        SWIFT_INCLUDE_PATHS:
          - $(PROJECT_DIR)/../arbor-engine/generated/swift
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -fmodule-map-file=$(PROJECT_DIR)/../arbor-engine/generated/swift/arbor_engineFFI.modulemap
