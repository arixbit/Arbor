name: ArborUISmoke
options:
  bundleIdPrefix: com.arbor.smoke
  createIntermediateGroups: true
  # Match Arbor/project.yml: newer XcodeGen defaults to a project format that
  # the Xcode 15 runner in .github/workflows/ui-smoke.yml cannot open.
  projectFormat: xcode15_3
  deploymentTarget:
    macOS: "14.0"
targets:
  ArborUISmokeUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ArborUISmokeUITests.swift
      - path: ArborUIDiagnosticsUITests.swift
      - path: ArborUIVisualCaptureUITests.swift
      - path: ArborUIUserFlowUITests.swift
      - path: Support
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
schemes:
  ArborUISmoke:
    build:
      targets:
        ArborUISmokeUITests: [test]
    test:
      targets:
        - ArborUISmokeUITests
