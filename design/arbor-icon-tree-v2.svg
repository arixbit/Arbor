<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.34" r="0.95">
      <stop offset="0" stop-color="#1b2340"/>
      <stop offset="0.6" stop-color="#0c1226"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="leaf" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 主干：微弯，向右倾 -->
  <path d="M 470 895 C 495 740, 515 560, 545 382" fill="none" stroke="url(#tree)" stroke-width="36" stroke-linecap="round"/>

  <!-- 分枝：长短、高低、方向不一（打破对称） -->
  <g stroke="url(#tree)" stroke-linecap="round" fill="none">
    <path d="M 525 560 Q 665 430 785 292" stroke-width="22"/>
    <path d="M 518 505 Q 415 442 337 380" stroke-width="18"/>
    <path d="M 522 660 Q 625 585 713 517" stroke-width="18"/>
    <path d="M 545 382 Q 482 302 432 258" stroke-width="14"/>
    <path d="M 545 382 Q 600 322 638 288" stroke-width="12"/>
  </g>

  <!-- 节点：大小错落，聚散成冠 -->
  <g fill="url(#leaf)" filter="url(#glow)">
    <circle cx="552" cy="374" r="46"/>
    <circle cx="793" cy="282" r="50"/>
    <circle cx="330" cy="372" r="42"/>
    <circle cx="721" cy="507" r="42"/>
    <circle cx="424" cy="248" r="34"/>
    <circle cx="646" cy="278" r="28"/>
  </g>
</svg>
