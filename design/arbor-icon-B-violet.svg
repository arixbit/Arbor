<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#1a1838"/>
      <stop offset="0.6" stop-color="#0e1024"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <!-- B 的渐变：靛蓝 → 紫 -->
    <linearGradient id="bgrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- B：竖笔为主线，两碗为"分支分出→汇回" -->
  <g stroke="url(#bgrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 420 210 L 420 815" stroke-width="40"/>
    <path d="M 420 210 C 630 210, 745 255, 745 340 C 745 425, 630 470, 420 470" stroke-width="40"/>
    <path d="M 420 470 C 660 470, 790 525, 790 645 C 790 765, 660 815, 420 815" stroke-width="40"/>
  </g>

  <!-- commit 点：主线节点 + 分支顶端 -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="420" cy="210" r="40"/>
    <circle cx="420" cy="470" r="40"/>
    <circle cx="420" cy="815" r="40"/>
    <circle cx="745" cy="340" r="46"/>
    <circle cx="790" cy="645" r="46"/>
  </g>
</svg>
