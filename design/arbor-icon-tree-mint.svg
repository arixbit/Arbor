<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 深靛蓝底 -->
    <radialGradient id="bg" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#1b2340"/>
      <stop offset="0.6" stop-color="#0c1226"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <!-- 树：薄荷绿纵向渐变（底部深→顶端亮，像向阳生长） -->
    <linearGradient id="tree" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <!-- 节点：亮薄荷 -->
    <radialGradient id="leaf" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#34d399"/>
    </radialGradient>
    <!-- 克制辉光 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 树（几何抽象，对称） -->
  <g stroke="url(#tree)" stroke-linecap="round" fill="none">
    <path d="M 512 892 L 512 320" stroke-width="34"/>
    <path d="M 512 642 Q 430 558 348 486" stroke-width="24"/>
    <path d="M 512 642 Q 594 558 676 486" stroke-width="24"/>
    <path d="M 512 486 Q 452 414 396 356" stroke-width="18"/>
    <path d="M 512 486 Q 572 414 628 356" stroke-width="18"/>
  </g>

  <!-- 节点（commit / 叶子），发光 -->
  <g fill="url(#leaf)" filter="url(#glow)">
    <circle cx="512" cy="252" r="54"/>
    <circle cx="348" cy="486" r="46"/>
    <circle cx="676" cy="486" r="46"/>
    <circle cx="396" cy="356" r="42"/>
    <circle cx="628" cy="356" r="42"/>
  </g>
</svg>
