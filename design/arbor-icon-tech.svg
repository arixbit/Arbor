<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 深海军蓝科技底 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d3a"/>
      <stop offset="0.6" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#050812"/>
    </linearGradient>
    <!-- 主线：青 → 紫 渐变 -->
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <!-- commit 节点：白芯 + 青 -->
    <radialGradient id="node" cx="0.35" cy="0.30" r="1">
      <stop offset="0" stop-color="#f0fdff"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </radialGradient>
    <!-- 合并节点：白芯 + 紫 -->
    <radialGradient id="mergenode" cx="0.35" cy="0.30" r="1">
      <stop offset="0" stop-color="#fdf4ff"/>
      <stop offset="0.5" stop-color="#d8b4fe"/>
      <stop offset="1" stop-color="#9333ea"/>
    </radialGradient>
    <!-- 霓虹辉光 -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 背景网格 -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#grid)"/>

  <!-- 中央柔光晕 -->
  <circle cx="520" cy="480" r="360" fill="#38bdf8" opacity="0.07" filter="url(#glow)"/>

  <!-- 分叉枝（branch → merge 回环），较细 -->
  <g filter="url(#glow)">
    <path d="M 500 640 C 270 650, 240 430, 420 350 C 560 290, 710 410, 700 492"
          fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
  </g>
  <path d="M 500 640 C 270 650, 240 430, 420 350 C 560 290, 710 410, 700 492"
        fill="none" stroke="#dff3ff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- 主枝（Arbor）主线，发光 -->
  <g filter="url(#glow)">
    <path d="M 180 905 C 300 780, 380 665, 520 622 C 680 575, 760 400, 865 215"
          fill="none" stroke="url(#line)" stroke-width="30" stroke-linecap="round"/>
  </g>
  <path d="M 180 905 C 300 780, 380 665, 520 622 C 680 575, 760 400, 865 215"
        fill="none" stroke="#eaf6ff" stroke-width="10" stroke-linecap="round"/>

  <!-- 分叉起点节点（青色） -->
  <circle cx="508" cy="634" r="26" fill="url(#node)"/>

  <!-- commit 节点（青色系） -->
  <g filter="url(#glow)">
    <circle cx="295" cy="808" r="42" fill="url(#node)"/>
    <circle cx="563" cy="596" r="42" fill="url(#node)"/>
    <circle cx="806" cy="312" r="36" fill="url(#node)"/>
  </g>
  <circle cx="295" cy="808" r="42" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7"/>
  <circle cx="563" cy="596" r="42" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7"/>
  <circle cx="806" cy="312" r="36" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7"/>

  <!-- 分叉枝上的 commit 节点（青色） -->
  <g filter="url(#glow)">
    <circle cx="352" cy="478" r="36" fill="url(#node)"/>
    <circle cx="470" cy="360" r="36" fill="url(#node)"/>
  </g>
  <circle cx="352" cy="478" r="36" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7"/>
  <circle cx="470" cy="360" r="36" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7"/>

  <!-- 合拢点（合并 commit，紫色突出） -->
  <g filter="url(#glow)">
    <circle cx="700" cy="492" r="48" fill="url(#mergenode)"/>
  </g>
  <circle cx="700" cy="492" r="48" fill="none" stroke="#e9d5ff" stroke-width="3" opacity="0.8"/>
</svg>
